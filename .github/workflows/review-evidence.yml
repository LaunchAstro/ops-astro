name: review evidence

# `review evidence for this revision` lives here alone, never in ci.yml (issue
# 93). A newer run of a workflow replaces its older run's results on the
# head, but a result from another workflow does not: when ci.yml held a copy,
# the edit run's pass sat beside the push run's failure and the pull request
# stayed blocked until someone re-ran that job. So this workflow runs on every
# event that can change the verdict, the head's and the description's, and
# its latest run is the one result.
#
# It holds one job, under the required check's exact name, with no condition
# and nothing it waits on, so an edit makes no new, skipped or cancelled run
# of any other check on the head (CQ-16). ci.yml runs every other check on a
# push, a label change and a reopen, and never on an edit. Its concurrency
# group is its own, so it cannot cancel a code run, and a newer run of this
# one cancels an older one still in flight.
#
# It does not wait for ci.yml's contamination gate, which no other workflow
# can name in `needs`. The gate is not what keeps head code from running: its
# own steps run scripts from the head. The token here is read-only, no secret
# reaches the job, and a failed gate still blocks the merge.
#
# The trigger is `pull_request`, never its `_target` form: the token stays
# read-only and no secret reaches the pull request's code.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Issue 151: `issues: read` lets the job list open issues, so a follow-up
# outcome can be held to one. Without it GitHub's listing gave this token pull
# requests only, and every follow-up read as "not an open issue". Every scope
# stays read.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: review evidence for this revision
    runs-on: ubuntu-latest
    steps:
      # Retargeting a pull request is an edit too, and every other check was
      # measured against the old base: the size, the commit range and the
      # sweep. This run fails until they run again, so none of them stands
      # green over a base it never read. On any other event this is empty.
      - name: A base change needs every check run again
        env:
          BASE_FROM: ${{ github.event.changes.base.ref.from }}
        run: |
          if [ -n "$BASE_FROM" ]; then
            echo "::error::The base branch changed from ${BASE_FROM}. Every check must run again against the new base: close and reopen the pull request, or push."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Issue 88: the check parses the body with markdown-it, pinned in the lockfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The checker's own cases
        run: bash tests/ci/review-evidence-cases.sh
      # The body as it stands when it is judged, not the event's copy: a run
      # queued before an edit must not judge the old body.
      - name: Read the description as it stands now
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Issue 88: the open issues, read with the same token, so a follow-up
        # outcome can be held to one. The check itself gets no token.
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' > "${RUNNER_TEMP}/pr-body.md"
          gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number' > "${RUNNER_TEMP}/open-issues.txt"
      - name: The review must cover the head being merged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          OPEN_ISSUES="$(cat "${RUNNER_TEMP}/open-issues.txt")" \
            PR_BODY="$(cat "${RUNNER_TEMP}/pr-body.md")" node scripts/review-evidence-check.mjs
