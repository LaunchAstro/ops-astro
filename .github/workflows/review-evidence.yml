name: review evidence

# `review evidence for this revision` lives here alone, never in ci.yml (issue
# 93). A newer run of a workflow replaces its older run's results on the
# head, but a result from another workflow does not: when ci.yml held a copy,
# the edit run's pass sat beside the push run's failure and the pull request
# stayed blocked until someone re-ran that job. So this workflow runs on every
# event that can change the verdict, the head's and the description's, and
# its latest run is the one result.
#
# It holds one job, under the required check's exact name, with no condition
# and nothing it waits on, so an edit makes no new, skipped or cancelled run
# of any other check on the head (CQ-16). ci.yml runs every other check on a
# push, a label change and a reopen, and never on an edit; adding the
# `sent-back` label instead fails ci.yml's gate on that head
# (scripts/sent-back-hold.mjs). Its concurrency
# group is its own, so it cannot cancel a code run, and a newer run of this
# one cancels an older one still in flight.
#
# It does not wait for ci.yml's contamination gate, which no other workflow
# can name in `needs`. The gate is not what keeps head code from running: its
# own steps run scripts from the head. The token here is read-only, no secret
# reaches the job, and a failed gate still blocks the merge. It runs the
# gate's queue-head check itself (scripts/queue-head-check.mjs), so a pull
# request on a merge-queue commit fails here too.
#
# The trigger is `pull_request`, never its `_target` form: the token stays
# read-only and no secret reaches the pull request's code.

# `labeled` and `unlabeled`: the `needs-sol` label is half of the owed mark
# that may stand in for Sol's record (owner, 1 October 2026), so a label
# change can change the verdict too.
#
# CI-QUEUE: `merge_group` too, so the check reports on the merge queue's
# build. A group holds several pull requests and carries none in its event:
# scripts/merge-group.mjs reads each one from the queue's merge commits, and
# the check judges every one, each pull request's own body against that pull
# request's own head, as it does on a pull request. One it cannot read fails
# the group.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:

# Issue 151: `issues: read` lets the job list open issues, so a follow-up
# outcome can be held to one. Without it GitHub's listing gave this token pull
# requests only, and every follow-up read as "not an open issue". Every scope
# stays read.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never a merge group (CI-SPEED); see ci.yml.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# CI-LOCAL: with OPS_CI_LOCAL set to `on`, a merge group's run goes to the
# M5's runners, as ci.yml's required jobs do; see the note there.
jobs:
  review-evidence:
    name: review evidence for this revision
    runs-on: ${{ github.event_name == 'merge_group' && vars.OPS_CI_LOCAL == 'on' && fromJSON('["self-hosted","ops-merge-m5"]') || 'ubuntu-latest' }}
    # Its slowest green run in the day to 1 October 2026: 1.1 min.
    timeout-minutes: 10
    steps:
      # Retargeting a pull request is an edit too, and every other check was
      # measured against the old base: the size, the commit range and the
      # sweep. This run fails until they run again, so none of them stands
      # green over a base it never read. On any other event this is empty.
      - name: A base change needs every check run again
        env:
          BASE_FROM: ${{ github.event.changes.base.ref.from }}
        run: |
          if [ -n "$BASE_FROM" ]; then
            echo "::error::The base branch changed from ${BASE_FROM}. Every check must run again against the new base: close and reopen the pull request, or push."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Issue 88: the check parses the body with markdown-it, pinned in the lockfile.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # CI-SPEED (#724): this job waits on no gate, so it runs the queue-head
      # check itself, as ci.yml's gate does: a pull request whose head is a
      # merge-queue commit fails here before anything is judged. git lists the
      # checkout's origin, the public repository, with no credential; a merge
      # group passes without listing (scripts/queue-head-check.mjs). The listing
      # needs the repository public: made private, it would fail every pull request.
      - name: A pull request never runs its checks on a merge-queue commit
        run: node scripts/queue-head-check.mjs
      - run: pnpm install --frozen-lockfile
      - name: The checker's own cases
        run: bash tests/ci/review-evidence-cases.sh
      # One line per pull request this run judges, `<number> <head> <base>`:
      # on a pull request, itself; on a merge group, each one the group holds.
      # No token reaches it.
      - name: The pull requests being judged
        run: |
          node scripts/merge-group.mjs list > "${RUNNER_TEMP}/prs.txt"
      # The body and the labels as they stand when they are judged, not the
      # event's copy: a run queued before an edit or a label change must not
      # judge the old ones.
      - name: Read the description as it stands now
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Issue 88: the open issues, read with the same token, so a follow-up
        # outcome can be held to one. The check itself gets no token.
        run: |
          while read -r PR_NUMBER _; do
            mkdir -p "${RUNNER_TEMP}/pr-${PR_NUMBER}"
            gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pr-${PR_NUMBER}/pull.json"
          done < "${RUNNER_TEMP}/prs.txt"
          gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number' > "${RUNNER_TEMP}/open-issues.txt"
      # Each pull request's body and labels come from its record above
      # (`.body // ""`, one label name per line), and the record must be that
      # pull request at the head being judged; on a group, open and on the
      # group's base branch too (scripts/merge-group.mjs).
      - name: The review must cover the head being merged
        run: |
          OPEN_ISSUES="$(cat "${RUNNER_TEMP}/open-issues.txt")" \
            node scripts/merge-group.mjs each --pulls "${RUNNER_TEMP}" node scripts/review-evidence-check.mjs
