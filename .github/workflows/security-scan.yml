name: security scan

# The security pass against staging (ticket S0-5 item 7; the sittings
# checklist's B-5): an OWASP ZAP baseline scan of the address it is given, then
# an authenticated ZAP API scan of every command route, signed in as a made-up
# member the job makes before the scan and removes after it. Its artefact is
# the findings table (severity, URL, rule, evidence): blockers and majors fail
# the run, minors are listed for the owner, informational alerts are listed
# apart. See deploy/staging/SECURITY-SCAN.md.
#
# Started by hand only. It never runs on a pull request, a push or the merge
# queue, and no required check names it. It scans made-up data only: the
# target must be the staging address its environment names, and every setting
# comes from the `staging-scan` environment's secrets, read by name.
#
# Every action is pinned to a full commit hash, and the ZAP image to its
# digest (docs/supply-chain-pins.md).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Staging's address, an origin only (it must equal the environment's STAGING_WEB_URL)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: security scan (by hand, not required)
    runs-on: ubuntu-24.04
    environment: staging-scan
    timeout-minutes: 90
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
      TARGET: ${{ inputs.target }}
      SCAN_LOGIN_PLACE: staging
      SCAN_LOGIN_FILE: ${{ runner.temp }}/scan-login.json
      SCAN_TOKEN_FILE: ${{ runner.temp }}/scan-token
      WORK: ${{ runner.temp }}/zap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The target is staging's address, and the API definition from the command surface
        env:
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          mkdir -p "$WORK" && chmod 777 "$WORK"
          node scripts/security/api-definition.mjs --target "$TARGET" --only "$STAGING_WEB_URL" \
            --business alpha --out "$WORK/api-definition.json"

      - name: Make the made-up scan login
        env:
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_LOOKUP_URL: ${{ secrets.DATABASE_LOOKUP_URL }}
          GOTRUE_URL: ${{ secrets.GOTRUE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/security/scan-login.mjs make
          echo "::add-mask::$(cat "$SCAN_TOKEN_FILE")"

      - name: ZAP baseline scan
        run: |
          status=0
          docker run --rm -v "$WORK:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -J baseline.json -r baseline.html -I || status=$?
          # 0 passed, 2 warnings (judged below by the findings table); 1 or 3 is ZAP's own failure.
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || { echo "ZAP baseline stopped ($status)"; exit 1; }

      - name: ZAP API scan, signed in as the scan login
        run: |
          ZAP_AUTH_HEADER_VALUE="Bearer $(cat "$SCAN_TOKEN_FILE")"
          ZAP_AUTH_HEADER_SITE="$(node -e 'console.log(new URL(process.env.TARGET).host)')"
          export ZAP_AUTH_HEADER_VALUE ZAP_AUTH_HEADER_SITE
          status=0
          docker run --rm -v "$WORK:/zap/wrk:rw" -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            -e ZAP_AUTH_HEADER=Authorization "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/api-definition.json -f openapi -J api.json -I \
            -z "-config scanner.maxScanDurationInMins=45" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || { echo "ZAP API scan stopped ($status)"; exit 1; }

      - name: The findings table
        id: findings
        if: ${{ !cancelled() }}
        run: |
          SCAN_BEARER="$(cat "$SCAN_TOKEN_FILE" 2>/dev/null || true)"
          export SCAN_BEARER
          status=0
          node scripts/security/findings.mjs --report baseline="$WORK/baseline.json" \
            --report api="$WORK/api.json" --out "$WORK/findings" --redact-env SCAN_BEARER || status=$?
          [ -f "$WORK/findings/findings.md" ] && cat "$WORK/findings/findings.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Remove the scan login
        if: ${{ always() }}
        env:
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_LOOKUP_URL: ${{ secrets.DATABASE_LOOKUP_URL }}
          GOTRUE_URL: ${{ secrets.GOTRUE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/security/scan-login.mjs remove

      # The redacted table and the baseline's own reports. The API scan's raw
      # reports stay on the runner: they were made with the scan login's token.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: security-scan-findings
          path: |
            ${{ runner.temp }}/zap/findings/
            ${{ runner.temp }}/zap/baseline.json
            ${{ runner.temp }}/zap/baseline.html
          if-no-files-found: warn
          retention-days: 90

      - name: Blockers and majors fail the run
        if: ${{ always() }}
        env:
          STATUS: ${{ steps.findings.outputs.status }}
        run: |
          [ "$STATUS" = "0" ] || { echo "the findings table holds a blocker or a major, or a report was missing"; exit 1; }
