name: ci

# Every action below is pinned to a full commit hash. A tag can be moved; a
# hash cannot. The comment beside each one says which release it was, so a
# human can read the file and a bot can bump it.

on:
  pull_request:
    # `labeled` and `unlabeled` were added in round four for the size
    # waivers. The waivers are retired (FU-400, 29 September 2026): the size
    # is reported, not limited, and no check reads a label. The triggers stay
    # as they were, so no required check changes when it runs.
    # `edited` is not here. The review-evidence check reads the pull request
    # body, so an edit must refresh that result (round five), but only that
    # one: review-evidence.yml holds that check alone and runs it on code
    # events and on `edited` (CQ-16, issue 93), so a description edit neither
    # re-runs nor cancels any other check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Read-only by default. A job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # First job, and deliberately first: a repository with client material in
    # it is not made acceptable by passing its type checks.
    name: contamination gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Required scanner runtime
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
      - name: Self-test, before anything is believed
        run: python3 scripts/gate/sweep.py --self-test
      - name: Install gitleaks for the secret-scan cases, verified before it is extracted
        env:
          # The same version and digest as the `gitleaks over the full history`
          # job. tests/gate/gate-cases.sh runs tests/gate/secrets-scan-cases.sh,
          # which needs gitleaks on PATH and refuses to run without it.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          bin="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$bin"
          curl -sSL --fail -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          # Only now, with the bytes proved, is anything unpacked.
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$bin" gitleaks
          rm -f "${RUNNER_TEMP}/${archive}"
          "$bin/gitleaks" version
          echo "$bin" >> "$GITHUB_PATH"
      - name: The cases the gate once missed
        run: bash tests/gate/gate-cases.sh
      - name: The pre-push hook's exit-code policy, under Husky's shell
        run: bash tests/gate/hook-exit-cases.sh
      - name: Every action pinned to a hash, and every pin recorded
        run: node scripts/pins-check.mjs
      - name: The pins checker's own cases
        run: bash tests/ci/pins-check-cases.sh
      - name: Every skill reference resolves
        run: node scripts/skill-refs-check.mjs
      - name: The session check passes on a clean checkout
        run: bash scripts/agent-session-check.sh
      - name: The session check's own scope cases
        run: bash tests/agents/session-check-cases.sh
      - name: Nothing merges itself
        run: node scripts/merge-policy-check.mjs
      - name: Sweep every blob in the incoming commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/gate/sweep.py --range "$BASE_SHA..$HEAD_SHA"
      - name: Sweep every tracked file
        run: python3 scripts/gate/sweep.py
      - name: Public content and metadata in every incoming commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/public-content-check.mjs --repo "$PWD" --range "$BASE_SHA..$HEAD_SHA"
      - name: Public content and metadata from the root
        if: github.event_name == 'push'
        run: node scripts/public-content-check.mjs --repo "$PWD" --range HEAD

  secrets:
    name: gitleaks over the full history
    # Nothing runs before the gate. A repository with client material in it is
    # not made acceptable by passing its other checks, and dependency install
    # executes third-party code, so it waits too. YAML order is not execution
    # order; only `needs` is.
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks, verified before it is extracted
        env:
          # Pinned by version and by digest. The digest is the one published
          # in the release's own checksums file, and it was checked against a
          # downloaded archive on 6 September 2026 before being written here.
          # Piping a download straight into tar runs whatever arrives.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL --fail -o "$archive" "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          # Only now, with the bytes proved, is anything unpacked.
          tar -xzf "$archive" gitleaks
          rm -f "$archive"
          ./gitleaks version
      - name: Scan every commit, not just the diff
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  check:
    name: local checks
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required local toolchain
        run: python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
      - name: Install gitleaks for pnpm check's secrets step, verified before it is extracted
        env:
          # The same version and digest as the `gitleaks over the full history`
          # job above. `pnpm check` runs `pnpm secrets`, which calls gitleaks
          # from PATH and fails when it is absent, so this job needs it too.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          bin="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$bin"
          curl -sSL --fail -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          # Only now, with the bytes proved, is anything unpacked.
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$bin" gitleaks
          rm -f "${RUNNER_TEMP}/${archive}"
          "$bin/gitleaks" version
          echo "$bin" >> "$GITHUB_PATH"
      - name: The pinned headless shell for MP-1-1's harness captures and the browser proofs
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm check
      # S0-6 content policy: the built page, in the headless shell above,
      # refuses planted scripts. Alone, since it builds apps/web/dist.
      - name: The built page refuses planted scripts in a real browser
        run: pnpm vitest run tests/browser/
        env:
          BROWSER_PROOFS: '1'
      - name: Semgrep p/default on the supply-chain settings, image pinned by digest (CQ-3)
        run: bash scripts/local/semgrep-settings.sh
      - name: Public content in the actual checked-out snapshot
        run: node scripts/public-content-check.mjs --repo "$PWD"
      # S0-1 promotion same artefact, a dry run in CI: the release step turns
      # the build `pnpm check` just made into the build output (the Vercel
      # re-plan), stored the way staging keeps it, under the name the staging
      # definition gives it; the promotion step must select it by the stamp
      # it carries, check its bytes against the digest it records, and record
      # it. It touches no service and no database.
      - name: S0-1 promotion same artefact, a dry run over the build output just made
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/web/dist/build.json', 'utf8')).build")"
          store="${RUNNER_TEMP}/artefacts"
          mkdir -p "$store"
          node scripts/ops/release.ts --out "${store}/ops-astro-${version}"
          node scripts/ops/promote.mjs --dry-run --version "$version" --artefacts "$store" \
            --line "CI dry run of the promotion step over the build just made"
      # INB-1g, the worker's leg: the inbox reads back after the worker is hard-killed
      # and replaced, on the runner's own disposable Postgres. It names the proof, so
      # a skip fails the step (tests/support/ci-must-run.ts).
      - name: The inbox reads back after the worker restarts
        env:
          DOCKER: docker
          L5_RUNTIME_PROOFS: '1'
        run: bash scripts/local/restart-proof.sh --suite tests/acceptance/inbox-worker-restart.test.ts

  database-gate:
    # Proving the gate. These probes start their own throwaway Postgres, run
    # controlled fixture suites through the enforcement runner and assert what
    # it refuses: a skipped database test, a named suite that is not on disk,
    # a run with zero tests, and a suite that passes without touching the
    # database at all. They prove the runner works. They say nothing about the
    # product, and they must not be read as saying anything about it.
    name: database conformance gate
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:cases

  database-shard:
    # Claiming product conformance. This runs the named invariant suite and the
    # affected conformance suites against a real Postgres, and it fails when a
    # named suite is missing, when any database test is skipped, when zero
    # tests ran, or when the suites passed without the database recording a
    # single transaction.
    #
    # Run one after another the suites took 40 to 50 minutes, so each shard
    # runs its share against a Postgres of its own; scripts/db-shards.mjs
    # splits them by measured time, and tests/ci/db-shards.test.ts proves every
    # suite lands in exactly one shard. Each shard still checks the whole
    # manifest (rules 2 and 3). `database conformance` below is the required
    # check, and it passes only when every shard did.
    name: database conformance shard ${{ matrix.shard }}
    needs: [gate]
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one red names all of its suites.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        # Postgres 17, the hosted database's major (S0-7), pinned by digest:
        # the image staging's database runs, recorded in
        # docs/supply-chain-pins.md. The password is this container's own, it is thrown away with it, and it
        # reaches nothing outside this job. No repository secret is used here,
        # and none should be: a check that needs a credential to prove a
        # database was reached is proving the wrong thing.
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # postgres:17-alpine
        env:
          POSTGRES_PASSWORD: conformance-throwaway
          POSTGRES_DB: conformance
        ports:
          - 5432:5432
        # Ready over TCP, the way the runner connects, not over the socket:
        # the image's init server listens on the socket only, so a socket
        # check can pass before TCP is up. tests/ci/db-ready-race.mjs
        # reproduces it, and withDatabase uses the same probe.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # The upgrade drill seeds through an older commit's checkout: full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:conformance --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          DATABASE_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
          # T4a's clone past a reader dumps and restores inside the server's
          # own container; the service container is not ops-astro-local-pg.
          FIXTURE_PG_CONTAINER: ${{ job.services.postgres.id }}
      # S0-3: a pull request that adds a migration upgrades a database built and
      # seeded at the base branch's newest migration, with the application
      # stopped, and every row must come through unchanged. No migration added,
      # nothing to drill; a push to main has no base to start from.
      - name: The upgrade drill, when this pull request adds a migration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DATABASE_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- migrations/)
          if [ -z "$added" ]; then echo "upgrade-drill: no migration added; not run"; exit 0; fi
          from=$(git ls-tree --name-only "$BASE_SHA" migrations/ | grep '\.sql$' | sort | tail -1)
          pnpm run verify:upgrade-drill --from "$(basename "$from" .sql)" --base "$BASE_SHA"

  database-lookahead:
    # S0-7: the same conformance run on Postgres 18, the next major, so a
    # change that breaks on it shows before the provider moves. It is not a
    # required check: its failure is reported red on the pull request and
    # blocks nothing. When the provider offers 18, one ticket moves
    # production, staging, CI and the restore drill to it together
    # (docs/supply-chain-pins.md).
    name: database look-ahead, Postgres 18 (not required)
    needs: [gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # postgres:18-alpine
        env:
          POSTGRES_PASSWORD: conformance-throwaway
          POSTGRES_DB: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # The upgrade drill seeds through an older commit's checkout: full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:conformance
        env:
          DATABASE_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
          OPS_ASTRO_DB_LOOKAHEAD_MAJOR: '18'

  database:
    # The required check (ruleset 23396133, .github/required-checks.json): one
    # name over every shard. `always()` runs it when a shard failed, was
    # skipped or was cancelled, and each of those fails it; without it this
    # job would be skipped, and a skipped required check reads as passed.
    # docs/agents/database-conformance.md holds what the check means.
    name: database conformance
    needs: [database-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard succeeded
        env:
          SHARDS: ${{ needs.database-shard.result }}
        run: |
          echo "database conformance shards: $SHARDS"
          test "$SHARDS" = success

  licences:
    name: OSI licence allowlist
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The checker's own negative cases
        run: bash tests/licences/licence-cases.sh
      - run: pnpm run licences

  commits:
    name: commit messages and provenance
    needs: [gate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every commit in the pull request, not only the tip
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/commit-range-check.mjs
      - name: The checker's own cases
        run: bash tests/ci/commit-range-cases.sh
      - name: Migrations already on the base branch are byte-unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/migrations-unchanged.mjs
      - name: The migration check's own cases
        run: node --test tests/ci/migrations-unchanged-cases.mjs

  pr-size:
    name: pull request size
    needs: [gate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure the diff against the size rule
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/pr-size.mjs
      - name: The size gate's own cases
        run: bash tests/ci/pr-size-cases.sh

  # The security gate (CQ-15, standing gate 9): three required checks, no secret
  # beyond the read-only token. scripts/security-gate.mjs judges both reports
  # against the reviewed, dated exceptions in .github/security-exceptions.json.
  audit:
    name: dependency audit
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # It reads the lockfile; nothing is installed, so no package code runs.
      - name: High or critical fails; a moderate needs a recorded exception
        run: |
          pnpm audit --json > "${RUNNER_TEMP}/audit.json" || true
          node scripts/security-gate.mjs audit --report "${RUNNER_TEMP}/audit.json"

  semgrep:
    name: static analysis
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # CQ-3's digest-pinned image; the rulesets come from the registry at run
      # time. Source read-only, report from stdout, no job environment passed.
      - name: Semgrep with p/default, p/secrets and p/typescript
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE"
          semgrep scan --config p/default --config p/secrets --config p/typescript
          --metrics off --json . > "${RUNNER_TEMP}/semgrep.json" || true
      - name: Every finding recorded with its reason, and none new
        run: node scripts/security-gate.mjs semgrep --report "${RUNNER_TEMP}/semgrep.json"

  isolation:
    # The client-isolation, restricted-call, pooled-crossover and permission
    # refusal suites (also in `database conformance`), named on their own.
    name: isolation tests
    needs: [gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same digest and throwaway password as `database conformance`.
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # postgres:17-alpine
        env:
          POSTGRES_PASSWORD: conformance-throwaway
          POSTGRES_DB: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/db-conformance.mjs --manifest tests/db/isolation-suites.json
        env:
          DATABASE_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
          # The T4a fixture suites are named here too; their clone past a
          # reader dumps and restores inside this job's own service container.
          FIXTURE_PG_CONTAINER: ${{ job.services.postgres.id }}
      # The named service-stop proof with both addresses a local setup has; it
      # skips without both, and the shard jobs set only one.
      - run: pnpm vitest run tests/ci/named-service-stop-proof-two-urls.test.ts
        env:
          DATABASE_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
          DATABASE_ADMIN_URL: postgres://postgres:conformance-throwaway@127.0.0.1:5432/conformance
          FIXTURE_PG_CONTAINER: ${{ job.services.postgres.id }}

  parity:
    # API-1: every app action has its API and CLI equivalent; no database.
    name: command parity
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/command-parity.mjs --check
      - run: pnpm vitest run tests/commands/api-1-catalogue.test.ts tests/commands/api-1-catalogue-authority.test.ts tests/commands/api-1-parity-bypasses.test.ts tests/commands/api-1-parity-redirects-and-agent-discovery.test.ts

  visual-drift:
    # MP-1-7: drift proved on the app's own page in the pinned headless shell on
    # Linux (`run.ts --app-drift`), with no private mockup and no key to it. The
    # live renderer, kernel release included, opens the step's log; the packet's
    # `ciRenderer` pins the rest. The page, control, token and theme are the
    # catalogue's `appDrift` (tests/visual/states.json).
    name: visual drift
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The pinned headless shell and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: The mode's own cases, against a made-up page
        run: node tests/visual/app-drift-cases.ts
      - run: pnpm build:web
      - name: App-only drift on the built app
        run: |
          set -euo pipefail
          pnpm --filter @launchastro/web exec vite preview --host 127.0.0.1 --port 5391 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:5391/ >/dev/null && break; sleep 1; done
          node tests/visual/run.ts --app-drift --app http://127.0.0.1:5391 --session tests/visual/made-up-session.json --out "$RUNNER_TEMP/visual"
