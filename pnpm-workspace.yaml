# ARCHITECTURE.md defines the planned package boundaries.
# Directories contain placeholders only. Packages are added through reviewed tickets.
packages:
  - 'packages/*'
  - 'apps/*'
# @swc/core ships a postinstall script and a prebuilt native binary in a
# platform package. The binary is what dependency-cruiser needs, and it loads
# without the script running, so the script does not run here. An install-time
# script is code executing on every machine that clones this repository; it
# needs a reason, and this one has none.
allowBuilds:
  '@swc/core': false
# Supply-chain settings, stated rather than left to pnpm's defaults (CQ-3).
# A new version waits 3 days (4320 minutes, the registry's 72-hour unpublish
# window) before an install may take it; renovate.json waits the same.
minimumReleaseAge: 4320
# vite 8.3.0 is the draft's pinned build; excluded from the minimum release age so the lockfile can hold it.
minimumReleaseAgeExclude:
  - vite@8.3.0
# Refuse a version published with weaker trust evidence than an earlier one.
trustPolicy: no-downgrade
# A dependency of a dependency comes from the registry, never a git URL or tarball.
blockExoticSubdeps: true
