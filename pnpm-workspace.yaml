# ARCHITECTURE.md defines the package boundaries. Packages are added through
# reviewed tickets.
packages:
  - 'packages/*'
  - 'apps/*'
# @swc/core ships a postinstall script and a prebuilt native binary in a
# platform package. The binary is what dependency-cruiser needs, and it loads
# without the script running, so the script does not run here. An install-time
# script is code executing on every machine that clones this repository; it
# needs a reason, and this one has none.
allowBuilds:
  '@swc/core': false
# A new version waits 7 days (10080 minutes), as in renovate.json (CQ-3).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Locked before the 7-day rule, or an advisory's fix; each comes out once a week old.
  - '@exodus/bytes@1.15.2' # published 21 Sep, a week old 28 Sep
  - tldts@7.4.14 # published 21 Sep, a week old 29 Sep
  - tldts-core@7.4.14 # published 21 Sep, a week old 29 Sep
  - source-map-js@1.2.2 # GHSA-68fv-2mgg-jv7q's fix; published 30 Sep, a week old 7 Oct
# source-map-js 1.0.0 to 1.2.1 carries GHSA-68fv-2mgg-jv7q (high); vite's postcss and
# jsdom's css-tree both pull it.
overrides:
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # jsdom's undici below 7.30.1 carries four high advisories (GHSA-xjj6-f33q-929c,
  # -4w7w-5xrc-9h26, -2m5v-pch6-74hx, -qrxm-fqhp-jwvm); commitlint's ajv pulls a
  # fast-uri below 3.1.9 (GHSA-w74x-v6f9-j3xg, -wjr9-j795-jxcr).
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # The agent stack is held to one copy each (#1715): langchain's own ranges
  # would let a second, newer langgraph and core in once they age.
  '@langchain/langgraph': 1.4.21
  '@langchain/core': 1.2.17
  '@langchain/langgraph-checkpoint': 1.1.6
  langsmith: 0.9.0
# Refuse a version published with weaker trust evidence than an earlier one.
trustPolicy: no-downgrade
# A dependency of a dependency comes from the registry, never a git URL or tarball.
blockExoticSubdeps: true
