<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The content policy (S0-6c, TR-SEC4-10). Only this origin's own script
      files run: no inline script, no eval, no other host. A script already in
      the page could still send requests with the session cookie, so nothing
      else may get in. Kept first, ahead of every script it governs. The dev
      server drops it (vite.config.ts), because Vite's fast refresh is inline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>Ops Astro</title>
    <!--
      No font link and no icon stylesheet. The pinned estate pulls Funnel Sans,
      Funnel Display, Chivo Mono and the Flaticon rounded set from two content
      delivery networks, and neither route establishes redistribution rights for
      an open-source release. The candidate's asset rule is that no unresolved
      asset ships by implication (#32), so the families are named in a stack with
      real fallbacks and nothing is fetched.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
