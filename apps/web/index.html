<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ops Astro</title>
    <!--
      The theme, before first paint. A classic inline script in the head runs
      while the parser reads it, ahead of every stylesheet and module, so the
      first frame already carries data-theme and a dark system never flashes
      white. A preference is handed to it as data-theme-preference on this
      element (light, dark or system); anything else follows the system, and
      keeps following it. Setting the attribute later goes through this same
      step. With none handed over, the tab's copy of the person's stored
      appearance (MP-2-11, apps/web/src/appearance.ts) is replayed, so a
      reload opens in the chosen theme.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var system = window.matchMedia('(prefers-color-scheme: dark)');
        if (!root.hasAttribute('data-theme-preference')) {
          var kept = null;
          try {
            kept = window.sessionStorage.getItem('ops-astro.appearance');
          } catch (e) {
            kept = null;
          }
          if (kept === 'light' || kept === 'dark' || kept === 'system') {
            root.setAttribute('data-theme-preference', kept);
          }
        }
        function apply() {
          var chosen = root.getAttribute('data-theme-preference');
          var dark = chosen === 'dark' || (chosen !== 'light' && system.matches);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
        apply();
        system.addEventListener('change', apply);
        new MutationObserver(apply).observe(root, {
          attributes: true,
          attributeFilter: ['data-theme-preference'],
        });
      })();
    </script>
    <!--
      No font link and no icon stylesheet. The pinned estate pulls Funnel Sans,
      Funnel Display, Chivo Mono and the Flaticon rounded set from two content
      delivery networks, and neither route establishes redistribution rights for
      an open-source release. The candidate's asset rule is that no unresolved
      asset ships by implication (#32), so the families are named in a stack with
      real fallbacks and nothing is fetched.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
