      LANGFUSE_IN_APP_AGENT_SANDBOX_PROVIDER: !reset null
      LANGFUSE_IN_APP_AGENT_SANDBOX_AWS_LAMBDA_MICROVM_IMAGE_IDENTIFIER: !reset null
      LANGFUSE_IN_APP_AGENT_SANDBOX_AWS_LAMBDA_MICROVM_EXECUTION_ROLE_ARN: !reset null
      LANGFUSE_IN_APP_AGENT_SANDBOX_AWS_LAMBDA_MICROVM_EGRESS_NETWORK_CONNECTOR_ARN: !reset null
      LANGFUSE_IN_APP_AGENT_SANDBOX_AWS_LAMBDA_MICROVM_REGION: !reset null

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.4@sha256:c7796a1335d14385c052f10061cf719f4a368a908432ec25980860b1333e9ccd
    restart: 'no'
    ports: !reset []
    environment:
      CLICKHOUSE_PASSWORD: ${TRACE_TARGET_CLICKHOUSE_PASSWORD:?}

  minio:
    image: cgr.dev/chainguard/minio@sha256:0322beaafcef0ee0d272195174279a3612f9a9b2a713fb4b3c399ab891ba0119
    restart: 'no'
    ports: !reset []
    environment:
      MINIO_ROOT_PASSWORD: ${TRACE_TARGET_MINIO_PASSWORD:?}

  redis:
    image: docker.io/valkey/valkey:8@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
    restart: 'no'
    command: !override
      - --requirepass
      - ${TRACE_TARGET_REDIS_PASSWORD:?}
      - --maxmemory-policy
      - noeviction
